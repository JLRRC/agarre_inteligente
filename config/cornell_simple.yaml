experiment_name: cornell_simple_baseline

data:
  root_dir: data/cornell_raw/cornell_grasp
  batch_size: 16
  num_workers: 4
  img_size: 224

train:
  num_epochs: 2
  lr: 0.001        # <= número, sin comillas
  weight_decay: 0.0001
  device: cpu      # de momento

model:
  name: simple_cnn  # o "resnet18" más adelante
  pretrained: false

metrics:
  iou_thresh: 0.25
  angle_thresh: 30.0

logging:
  output_dir: experiments
  save_best_by: val_success
# config/cornell_simple.yaml
experiment_name: CORNELL_SIMPLE_BASE

data:
  dataset: cornell
  root_dir: data/cornell_raw
  img_size: 224
  val_split: 0.2
  use_depth: true
  index_files:
    train: reports/cornell_audit/clean_idx_train_v2.txt
    val: reports/cornell_audit/clean_idx_val.txt

model:
  name: simple_grasp_cnn
  in_channels: 4

train:
  epochs: 10
  batch_size: 32
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 4
  seed: 0
  deterministic: true

logging:
  save_dir: experiments
  save_best_by: val_success