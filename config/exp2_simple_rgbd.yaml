experiment_name: EXP2_SIMPLE_RGBD

data:
  dataset: cornell
  root_dir: data/cornell_raw
  img_size: 224
  val_split: 0.2
  use_depth: true
  index_files:
    train: reports/cornell_audit/clean_idx_train_v2.txt
    val: reports/cornell_audit/clean_idx_val.txt

model:
  name: simple_cnn
  in_channels: 4
  pretrained: false

train:
  num_epochs: 10
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0
  num_workers: 4
  device: cuda

logging:
  base_dir: experiments
  ckpt_dirname: checkpoints
  metrics_filename: metrics.csv
  save_best_by: val_success

metrics:
  iou_thresh: 0.25
  angle_thresh: 30.0
