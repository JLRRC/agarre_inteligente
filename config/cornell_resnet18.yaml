# config/cornell_resnet18.yaml
experiment_name: CORNELL_RESNET18_BASE

data:
  dataset: cornell
  root_dir: data/cornell_raw
  img_size: 224
  val_split: 0.2
  use_depth: true
  index_files:
    train: reports/cornell_audit/clean_idx_train_v2.txt
    val: reports/cornell_audit/clean_idx_val.txt

model:
  name: resnet18_grasp
  in_channels: 4
  pretrained: true

train:
  epochs: 10
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  num_workers: 4
  seed: 0
  deterministic: true

logging:
  save_dir: experiments
  save_best_by: val_success
