experiment_name: "EXP2_SIMPLE_RGBD"

data:
  dataset: "cornell"
  root_dir: "data/cornell"
  img_size: 224
  use_rgb: true
  use_depth: true     # aquí activas profundidad
  val_split: 0.2

model:
  name: "simple_cnn"
  in_channels: 4      # RGB-D => 4 canales
  num_outputs: 5

train:
  batch_size: 32
  num_epochs: 10
  lr: 0.001
  weight_decay: 0.0
  num_workers: 4
  device: "cpu"

logging:
  base_dir: "experiments"
  ckpt_dirname: "checkpoints"
  metrics_filename: "metrics.csv"

metrics:
  iou_thresh: 0.25
  angle_thresh: 30.0
