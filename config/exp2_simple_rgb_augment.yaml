# config/exp2_simple_rgb_augment.yaml
experiment_name: EXP2_SIMPLE_RGBD

data:
  dataset: cornell
  root_dir: data/cornell_raw
  img_size: 224
  val_split: 0.2
  use_depth: true
  index_files:
    train: reports/cornell_audit/clean_idx_train_v2.txt
    val: reports/cornell_audit/clean_idx_val.txt

  # si tu código usa este bloque para activar/describir aug:
  augmentation:
    geometric: false
    photometric: false

model:
  name: simple_grasp_cnn
  in_channels: 4

train:
  epochs: 10
  batch_size: 32
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 4
  seed: 0
  deterministic: true

logging:
  save_dir: experiments
  save_best_by: val_success
