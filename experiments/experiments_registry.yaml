experiments:
  EXP1_SIMPLE_RGB:
    config: config/exp1_simple_rgb.yaml
    description: 'Experimento: EXP1_SIMPLE_RGB


      Objetivo:

      - Entrenar un modelo de agarre sobre cornell (RGB).


      Como se ejecuta:

      - ./scripts/run_one.sh config/exp1_simple_rgb.yaml 0


      Parametros importantes:

      - Modelo: simple_cnn

      - Modalidad: RGB

      - lr: 0.0005 | batch_size: 32 | epochs: 10 | seed: 0

      - root_dir: data/cornell_raw

      - index_files: train=reports/cornell_audit/clean_idx_train_v2.txt, val=reports/cornell_audit/clean_idx_val.txt

      - augmentations: none

      - save_best_by: val_success

      - metricas: val_success, val_iou, val_angle | iou_thresh=0.25, angle_thresh=30.0


      Reproducibilidad:

      - deterministic: False

      - Si se usa CUDA y deterministic=True, requiere CUBLAS_WORKSPACE_CONFIG.

      - Usa subsets limpios si index_files apunta a reports/cornell_audit.


      Salidas esperadas:

      - metrics.csv (por experimento)

      - checkpoints/best.pth y last.pth

      - plots en experiments/plots/


      Notas:

      - El entrenamiento copia config_used.yaml dentro del experimento.'
