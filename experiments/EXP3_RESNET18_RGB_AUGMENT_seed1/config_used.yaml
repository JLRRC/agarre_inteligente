experiment_name: EXP3_RESNET18_RGB_AUGMENT

data:
  dataset: cornell
  root_dir: data/cornell_raw
  img_size: 224
  val_split: 0.2
  use_depth: false
  augmentation:
    geometric: true
    photometric: true
  index_files:
    train: reports/cornell_audit/clean_idx_train_v2.txt
    val: reports/cornell_audit/clean_idx_val.txt

model:
  name: resnet18
  pretrained: true

train:
  num_epochs: 10
  batch_size: 32
  lr: 0.0005
  weight_decay: 0.0001
  num_workers: 4
  device: "cuda"

logging:
  output_dir: experiments
  save_best_by: val_success

metrics:
  iou_thresh: 0.25
  angle_thresh: 30.0
